addon: "Rebar 生物"
item:
  soul_shard:
    no-mob-type: "<red>未绑定"
  soul_cage:
    lore: |-
      <arrow> 一座由腐化金属锻造的牢笼，贪婪地渴求灵魂。
      <arrow> 它扭曲了生与死之间的界限。

      <guidearrow> 使用<item:rebarmobs:soul_shard><insn>右键点击</insn>以激活。
      <guidearrow> <insn>潜行 + 右键点击</insn>以收回<item:rebarmobs:soul_shard>并取消激活。
    waila:
      empty: "灵魂笼子 | <red>空"
      filled: "灵魂笼子 | %mob-type% | 等级 %tier%"
  vile_sword:
    lore: |-
      <arrow> 主手手持该剑击杀
      <arrow> 可额外获得一个灵魂。
  mob_head_info:
    lore: |-
      <arrow> 击杀指定的生物有几率掉落其头颅。
      <arrow> 斩首者附魔可额外增加几率。

      <arrow> <attr>基础几率:</attr> %base-chance%
      <arrow> <attr>斩首者几率:</attr> 每级%decapitator-chance%
enchantment:
  soul_stealer: "灵魂收割者"
  decapitator: "斩首者"
command:
  description: "RebarMobs 主命令"
  enchantment_book:
    description: "获取指定附魔和等级的附魔书（默认1级）"
    invalid-enchantment: "<red>无效的附魔。"
    invalid-level: "<red>无效的附魔等级。"
    success: "<green>成功获得%enchantment%附魔书，等级%level%"
